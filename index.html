<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIKOn Kesäkalenteri 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="kalenteri.css">
</head>
<body>

<div class="sky-bg"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="cloud"></div>
<div class="sun"></div>

<header>
  <h1>TIKOn <span>Kesäkalenteri</span></h1>
  <div class="header-meta">
    <div class="meta-pill"><span class="dot"></span> 13 viikkoa</div>
    <div class="meta-pill"><span class="dot" style="background:var(--sky)"></span> 18.5.–16.8.2026</div>
  </div>
</header>

<div class="date-bar">
  <div class="date-range">
    <div>
      <div class="date-range-label">Kesäloma 2026</div>
      <div class="date-range-text">18. toukokuuta → 16. elokuuta</div>
    </div>
    <div class="progress-wrap">
      <div class="date-range-label" style="margin-bottom:6px" id="progress-label">Kesä alkaa pian!</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<!-- Kalenteri-grid: luukut lisätään tähän JavaScriptillä -->
<div class="calendar" id="calendar"></div>

<!-- Heinänkorret sivun alareunaan -->
<div class="grass" id="grass"></div>

<!-- Modal-ikkuna -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalBtn()">✕</button>
    <div class="modal-week" id="modal-week"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-category" id="modal-category"></div>
    <div class="modal-desc" id="modal-desc"></div>
    <div class="modal-location" id="modal-location" onclick="openMap()">📍 <span id="modal-location-text"></span></div>
  </div>
</div>

<!-- JS-tiedostot ladataan body:n loppuun, jotta HTML on valmis ennen skriptejä -->
<script src="data.js"></script>
<script src="kalenteri.js"></script>
<script src="modal.js"></script>
<script src="effects.js"></script>

</body>
</html>
